# Scrollable-tiling (niri-like) layout.

scrolling {
    column_width = 0.5
    fullscreen_on_one_column = true
    focus_fit_method = 1          # 0 = center, 1 = fit
    follow_focus = true
    follow_min_visible = 0.4
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    direction = right
}

# Фокус
bind = $mainMod, left,  layoutmsg, focus l
bind = $mainMod, right, layoutmsg, focus r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Перемещение окна между колонками (swap с соседней)
bind = $mainMod CTRL, left,  layoutmsg, swapcol l
bind = $mainMod CTRL, right, layoutmsg, swapcol r

# Прокрутка ленты без смены фокуса (аналог scroll мышью в niri)
bind = $mainMod ALT, left,  layoutmsg, move -col
bind = $mainMod ALT, right, layoutmsg, move +col

# Ресайз колонки: цикл по preset-ширинам / точная подстройка
bind = $mainMod, R,         layoutmsg, colresize +conf
bind = $mainMod SHIFT, R,   layoutmsg, colresize -conf
binde = $mainMod CTRL, up,   layoutmsg, colresize +0.05
binde = $mainMod CTRL, down, layoutmsg, colresize -0.05

# Выделить окно в отдельную колонку / убрать обратно в предыдущую
# (замена togglesplit — вместо него promote/consume)
bind = $mainMod SHIFT, J, layoutmsg, consume_or_expel prev

# Вписать колонку в экран / растянуть на всё свободное место
bind = $mainMod, V,       layoutmsg, fit active
bind = $mainMod SHIFT, V, layoutmsg, fit expand

# Заморозить прокрутку ленты за фокусом (на текущем workspace)
bind = $mainMod, X, layoutmsg, inhibit_scroll
