[mgr]
ratio = [1, 3, 4]
sort_by = "mtime"
sort_sensitive = false
sort_reverse = true
sort_dir_first = true
linemode = "size_mtime"

[[plugin.prepend_previewers]]
url = "*/"
run = "eza-preview"

# Image, video, and PDF previews use Yazi's built-in graphics previewers.
# KGP inside Zellij requires Yazi >= 26.8.15 and Zellij >= 0.45.0.
[[plugin.prepend_previewers]]
mime = "audio/*"
run = 'faster-piper -- "$HOME/.config/yazi/scripts/media-preview.sh" "$1" "$h"'

[[plugin.prepend_previewers]]
url = "*.md"
run = 'faster-piper -- mdcat --ansi --columns $w "$1"'

[[plugin.prepend_previewers]]
mime = "application/bittorrent"
run = "torrent-preview"

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd}"
run = "ouch"

[opener]
image = [
  { run = 'lightningview %s1; hyprctl dispatch focuswindow "title:^(yazi)$"', block = true, desc = "LightningView", for = "unix" },
]

edit = [{ run = 'hx %s', block = true, desc = "Helix", for = "unix" }]

extract = [
  { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = "image" },
  { mime = "text/plain", use = "edit" },
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
]

[preview]
max_width = 1600
max_height = 1100
image_delay = 0
